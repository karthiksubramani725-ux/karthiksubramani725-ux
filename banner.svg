<svg fill="none" viewBox="0 0 850 130" width="850" height="130" xmlns="http://w3.org">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        @keyframes typing {
          0%, 10% { width: 0; }
          45%, 85% { width: 100%; }
          95%, 100% { width: 0; }
        }
        @keyframes blink {
          50% { border-color: transparent; }
        }
        @keyframes glow {
          0%, 100% { box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
          50% { box-shadow: 0 0 24px rgba(56, 189, 248, 0.55); }
        }
        .container {
          font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, monospace;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 22px 24px;
          text-align: center;
          animation: glow 4s ease-in-out infinite;
        }
        .title {
          color: #f0f6fc;
          font-size: 26px;
          font-weight: 800;
          letter-spacing: 2px;
          margin: 0 0 10px 0;
        }
        .type-wrap {
          display: inline-block;
        }
        .typing-text {
          color: #38bdf8;
          font-size: 16px;
          font-weight: 600;
          overflow: hidden;
          white-space: nowrap;
          border-right: 2px solid #38bdf8;
          width: 0;
          animation: typing 7s steps(56, end) infinite, blink 0.75s step-end infinite;
        }
      </style>
      <div class="container">
        <div class="title">KARTHIK SUBRAMANI</div>
        <div class="type-wrap">
          <div class="typing-text">GAME SYSTEMS ENGINEER • WIN32 DLL • UNREAL ENGINE 5 • TOKYO</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
